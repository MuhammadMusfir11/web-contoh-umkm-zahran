gudeg:['Lestari Putri, Solo','Manisnya pas dan nangkanya empuk. Dipesan untuk arisan, semua tamu suka.'],
cendol:['Agus Pratama, Bekasi','Segar sekali, santannya gurih dan gula merahnya wangi. Pas untuk penutup.']};
document.getElementById('list').innerHTML=Object.entries(D).map(([k,m],i)=>{
 const [n,t]=R[k]||['Pelanggan','Belum ada ulasan untuk menu ini.'];
 return `<article class="rev ${i%2?'r':'l'} rv"><div class="pic" style="--g:${m.g}"><img src="${m.img}" alt="${m.title}" onerror="this.remove()"><h3>${m.title}</h3></div><figure class="panel"><div class="stars" aria-label="5 dari 5 bintang">★★★★★</div><p>“${t}”</p><figcaption>${n}</figcaption></figure></article>`}).join('');
